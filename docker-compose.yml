
services:
  postgres:
    image: postgres:16
    container_name: thesystem-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: thesystem
      POSTGRES_USER: thesystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesystem -d thesystem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
